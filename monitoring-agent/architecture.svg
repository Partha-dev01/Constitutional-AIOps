<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="ma-title ma-desc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="ma-title">Monitoring agent data flow</title>
  <desc id="ma-desc">On a remote host, your Docker containers emit logs and metrics that Alloy ships over TLS with basic auth to the AWS VM, where Caddy routes /ingest/loki to Loki, /ingest/prom to Prometheus, and /ingest/otlp to Tempo, feeding the backend telemetry collector.</desc>
  <defs>
    <marker id="ma-ah" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 Z" fill="#3b82f6"/></marker>
  </defs>
  <rect x="6" y="6" width="788" height="318" rx="18" fill="#050c1c" stroke="#1e293b" stroke-width="1.5"/>

  <!-- remote host region -->
  <rect x="28" y="54" width="300" height="252" rx="14" fill="#0a1526" stroke="#20304a" stroke-width="1.3"/>
  <text x="44" y="80" fill="#64748b" font-size="10" font-weight="600" letter-spacing="2">REMOTE HOST</text>
  <rect x="48" y="92" width="260" height="58" rx="10" fill="#0b1628" stroke="#24324a" stroke-width="1.4"/>
  <text x="64" y="118" fill="#f8fafc" font-size="13.5" font-weight="600">Your Docker containers</text>
  <text x="64" y="138" fill="#94a3b8" font-size="11">stdout &#183; /metrics</text>
  <line x1="178" y1="150" x2="178" y2="195" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#ma-ah)"/>
  <rect x="108" y="198" width="140" height="52" rx="10" fill="#0c1b33" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="178" y="222" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="600">Alloy</text>
  <text x="178" y="240" text-anchor="middle" fill="#94a3b8" font-size="10.5">telemetry shipper</text>

  <!-- cross link -->
  <text x="398" y="150" text-anchor="middle" fill="#cbd5e1" font-size="11">logs &#183; metrics &#183; traces</text>
  <text x="398" y="166" text-anchor="middle" fill="#64748b" font-size="10.5">over TLS + basic auth</text>
  <line x1="336" y1="178" x2="460" y2="178" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ma-ah)"/>

  <!-- AWS VM region -->
  <rect x="468" y="54" width="304" height="252" rx="14" fill="#0a1526" stroke="#20304a" stroke-width="1.3"/>
  <text x="484" y="80" fill="#64748b" font-size="10" font-weight="600" letter-spacing="1">AWS VM &#183; aiops.example.com</text>
  <rect x="488" y="90" width="264" height="42" rx="10" fill="#0c1b33" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="504" y="116" fill="#f8fafc" font-size="12.5" font-weight="600">Caddy &#183; /ingest/* (basic auth)</text>

  <rect x="488" y="140" width="264" height="26" rx="7" fill="#0b1628" stroke="#24324a"/>
  <text x="504" y="157" fill="#93c5fd" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/ingest/loki  &#8594;  Loki</text>
  <rect x="488" y="170" width="264" height="26" rx="7" fill="#0b1628" stroke="#24324a"/>
  <text x="504" y="187" fill="#93c5fd" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/ingest/prom  &#8594;  Prometheus</text>
  <rect x="488" y="200" width="264" height="26" rx="7" fill="#0b1628" stroke="#24324a"/>
  <text x="504" y="217" fill="#93c5fd" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/ingest/otlp  &#8594;  Tempo</text>

  <line x1="620" y1="226" x2="620" y2="243" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#ma-ah)"/>
  <rect x="488" y="246" width="264" height="44" rx="10" fill="#0b1628" stroke="#24324a" stroke-width="1.4"/>
  <text x="620" y="273" text-anchor="middle" fill="#f8fafc" font-size="12.5" font-weight="600">Backend &#183; TelemetryCollector</text>
</svg>
