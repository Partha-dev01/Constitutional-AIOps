server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Scrape Docker container logs via Docker service discovery so that the
  # `container` label (derived from the container name) is stamped on every
  # log stream.  This mirrors the remote Alloy edge-agent relabel rule in
  # monitoring-agent/config.alloy:32-36 so that both local and remote logs
  # share the same `container` label scheme that the collector queries.
  - job_name: containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s

    relabel_configs:
      # Strip the leading "/" from the Docker container name (e.g.
      # "/aiops-backend" → "aiops-backend"), matching Alloy's regex "/(.*)"
      # rule so local and remote container labels are consistent.
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      # Keep the containerlogs job label for backwards compatibility.
      - target_label: job
        replacement: containerlogs

    pipeline_stages:
      # Parse Docker JSON log format
      - json:
          expressions:
            output: log
            stream: stream
            timestamp: time
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - labels:
          stream:
      - output:
          source: output
      # Detect log level from content
      - regex:
          expression: '(?i)(?P<level>error|warn|info|debug|trace|critical|fatal)'
      - labels:
          level:
