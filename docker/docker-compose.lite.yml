# Constitutional AIOps — LITE self-host profile (5c WS3).
#
# The minimal, low-cost deployment: backend + frontend + (optional) Caddy edge.
# NO GPU, NO bundled models (bring your own LLM endpoint), NO Neo4j, NO LGTM.
# The app degrades gracefully without Neo4j/observability — src/main.py falls
# back to an in-memory episode store and the Graph/Metrics pages show fallback
# data — so this is a genuine one-command self-host, not a crippled build.
#
# ALWAYS pass --env-file .env. Compose reads the interpolation .env from THIS
# file's directory (docker/), NOT the repo root, so a bare
# `-f docker/docker-compose.lite.yml` invocation does NOT auto-load the root
# .env. Omitting it blanks the bring-your-own endpoint AND (via the
# ENVIRONMENT=production default below) trips the WS_TOKEN startup guard, so the
# backend crash-loops. Verified on Docker Compose v5.5.0.
#
# SELF-CONTAINED — use it ALONE, not layered on docker-compose.yml:
#
#   Localhost (no TLS, ports published):
#     docker compose -f docker/docker-compose.lite.yml --env-file .env up -d
#       -> frontend http://localhost:3000 , backend http://localhost:8000
#
#   Public edge (Caddy + Let's Encrypt TLS on a domain) — our AWS lite tier:
#     docker compose -f docker/docker-compose.lite.yml --env-file .env --profile edge up -d
#       -> needs APP_DOMAIN + ACME_EMAIL; frontend/backend stay internal, only
#          Caddy binds 80/443. Its access log feeds aws/idle-check.sh.
#
# Bring your own LLM endpoint (.env, OpenAI-compatible). Both agents MAY point at
# the SAME URL + model for a single-endpoint setup:
#   FAST_AGENT_URL, REASONING_AGENT_URL
#   FAST_AGENT_MODEL, REASONING_AGENT_MODEL
#   LLM_API_KEY                 (secured endpoint; optional, empty = no auth header)
#
# The full/GPU stack (Neo4j + LGTM + local vLLM) lives in docker-compose.yml +
# docker/docker-compose.{gpu,production}.yml — spin it up on demand, not here.
#
# MEMORY LIMITS: sized from an on-VM steady-state measurement (aws/measure-lite-rss.sh,
# s78 2026-08-30): peak total RSS ~0.74 GiB under a live chat (backend ~700 MiB,
# frontend ~13 MiB, caddy ~48 MiB). With OS + docker daemon (~0.4 GiB) plus headroom,
# a 2 GiB instance (t3/t4g.small) is sufficient — the t3.medium (4 GiB) is oversized.

services:
  backend:
    build:
      context: ..                       # repo root (this file is in docker/)
      dockerfile: docker/Dockerfile.backend
      args:
        # CPU-only torch: this box has no GPU (LLM is a remote Bedrock/BYO
        # endpoint), so pull the ~200MB CPU wheel instead of the multi-GB CUDA
        # build + nvidia-cu* stack. Keeps the image ~1.3GB (fits the 20GB lite
        # disk) with zero functional loss — embeddings/BERTScore run on CPU.
        - TORCH_INDEX_URL=https://download.pytorch.org/whl/cpu
    container_name: aiops-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      # --- Bring-your-own LLM endpoint (OpenAI-compatible) ---
      - FAST_AGENT_URL=${FAST_AGENT_URL}
      - REASONING_AGENT_URL=${REASONING_AGENT_URL}
      - FAST_AGENT_MODEL=${FAST_AGENT_MODEL}
      - REASONING_AGENT_MODEL=${REASONING_AGENT_MODEL}
      # Bearer token for a secured endpoint (empty = no Authorization header).
      # LLM_API_KEY covers both agents; *_AGENT_API_KEY override per agent.
      - LLM_API_KEY=${LLM_API_KEY:-}
      - FAST_AGENT_API_KEY=${FAST_AGENT_API_KEY:-}
      - REASONING_AGENT_API_KEY=${REASONING_AGENT_API_KEY:-}
      # --- Neo4j/LGTM are NOT deployed in lite ---
      # Point NEO4J_URI at the IPv4 loopback LITERAL, not "localhost". With no
      # Neo4j running the connect must fail fast into the app's in-memory
      # fallback; on a dual-stack box "localhost" resolves to ::1 first and the
      # IPv6 attempt stalls ~14s inside the FastAPI lifespan (blocking uvicorn
      # from serving for that whole window on a cold wake), whereas 127.0.0.1
      # refuses instantly. Overridable for a self-hoster who DOES run Neo4j.
      - NEO4J_URI=${NEO4J_URI:-bolt://127.0.0.1:7687}
      # NEO4J_PASSWORD is a dummy only so the production secret-guard
      # (_require_password) does not refuse to boot.
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-lite-unused}
      # Lite ships WITHOUT Neo4j, so the startup connect must FAIL FAST to the
      # in-memory fallback. The default 8-attempt backoff wastes ~75s retrying a
      # dead port, and because that runs inside the FastAPI lifespan it BLOCKS
      # uvicorn from accepting connections — so the edge 502s the entire cold-wake
      # window. One attempt = instant connection-refused -> fallback (~sub-second).
      - NEO4J_CONNECT_MAX_ATTEMPTS=${NEO4J_CONNECT_MAX_ATTEMPTS:-1}
      # LGTM observability (Loki/Prometheus/Tempo) is NOT deployed in lite. Pass
      # these EMPTY so the telemetry collector treats each backend as absent and
      # SKIPS the HTTP poll (no "All connection attempts failed" log spam every
      # ~30s); logs fall back to the Docker-socket source and the dashboards read
      # the richer /api/v1/health. The full/GPU stack sets real URLs, unaffected.
      - LOKI_URL=${LOKI_URL:-}
      - PROMETHEUS_URL=${PROMETHEUS_URL:-}
      - TEMPO_URL=${TEMPO_URL:-}
      # --- App ---
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=false
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # (API_WORKERS removed — the backend CMD runs a single uvicorn worker and
      # never reads it, so passing it was dead config.)
      - AIOPS_DATA_DIR=/app/data/state
      # Serve the interactive API reference (Swagger /docs, ReDoc, OpenAPI) even
      # in production. OFF by default (self-host stays closed); our hosted box
      # sets it true so the public Docs "API reference" link works.
      - AIOPS_ENABLE_DOCS=${AIOPS_ENABLE_DOCS:-false}
      # CORS: the origin the browser loads the SPA from. Localhost profile is
      # cross-origin (SPA :3000 -> API :8000) so it must be listed; the edge
      # profile is same-origin under APP_DOMAIN.
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      # In-app auth (OFF by default; set AUTH_REQUIRED=true + admin creds to gate).
      - AUTH_REQUIRED=${AUTH_REQUIRED:-false}
      - AUTH_ADMIN_USER=${AUTH_ADMIN_USER:-}
      - AUTH_ADMIN_PASSWORD=${AUTH_ADMIN_PASSWORD:-}
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY:-}
      # /ws guard token — REQUIRED when ENVIRONMENT=production (see main.py).
      - WS_TOKEN=${WS_TOKEN:-}
      # Public self-service signup (hosted demo only; OFF by default so a
      # self-host stays admin-managed). Set AIOPS_ENABLE_PUBLIC_SIGNUP=true plus
      # the captcha/SMTP vars in .env to turn it on. Captcha + email are both
      # optional (soft email verification); see docs/DEPLOYMENT.md §6.1.
      - AIOPS_ENABLE_PUBLIC_SIGNUP=${AIOPS_ENABLE_PUBLIC_SIGNUP:-false}
      - SIGNUP_CAPTCHA_PROVIDER=${SIGNUP_CAPTCHA_PROVIDER:-}
      - SIGNUP_CAPTCHA_SITE_KEY=${SIGNUP_CAPTCHA_SITE_KEY:-}
      - SIGNUP_CAPTCHA_SECRET=${SIGNUP_CAPTCHA_SECRET:-}
      - SIGNUP_SMTP_HOST=${SIGNUP_SMTP_HOST:-}
      - SIGNUP_SMTP_PORT=${SIGNUP_SMTP_PORT:-587}
      - SIGNUP_SMTP_USER=${SIGNUP_SMTP_USER:-}
      - SIGNUP_SMTP_PASSWORD=${SIGNUP_SMTP_PASSWORD:-}
      - SIGNUP_EMAIL_FROM=${SIGNUP_EMAIL_FROM:-}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
    volumes:
      - aiops-lite-state:/app/data/state
      # Docker socket: lets the backend read REAL container status so the
      # Dashboard "Service Availability" + Infrastructure pages show the actual
      # running containers (backend/frontend/caddy) and their health, instead of
      # an empty "Docker unavailable" fallback. Trade-off: a container with the
      # host Docker socket can control the daemon, so keep the box locked down.
      # This mount alone does NOT enable restart/scale remediation — that is a
      # SEPARATE opt-in that also needs AIOPS_ENABLE_ACTION_TOOLS=true (left off).
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - aiops-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1024M               # measured backend RSS ~700 MiB (s78) + ~45% headroom
          cpus: '2'
    healthcheck:
      # Liveness only (constant 200, no LLM/DB probing) so the container flips to
      # healthy as soon as uvicorn serves -- which also releases the frontend's
      # depends_on:service_healthy sooner on a cold wake. The richer
      # /api/v1/health (which probes the LLM + telemetry) drives the dashboards,
      # not this gate.
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        # Localhost default: SPA calls the backend cross-origin at :8000. For the
        # edge profile set PUBLIC_API_URL=/api/v1 so the bundle is same-origin.
        - VITE_API_URL=${PUBLIC_API_URL:-http://localhost:8000/api/v1}
        # Top-left brand link. Empty = self-host (links to app home); our hosted
        # build sets PUBLIC_LANDING_URL to the marketing site.
        - VITE_LANDING_URL=${PUBLIC_LANDING_URL:-}
    container_name: aiops-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - aiops-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # Optional public edge (TLS + domain). Enable with `--profile edge`. Uses the
  # trimmed docker/configs/Caddyfile.lite (no Grafana / no /ingest). Its stdout
  # access log is the liveness signal for aws/idle-check.sh (sleep-when-idle).
  caddy:
    image: caddy:2.8-alpine
    container_name: aiops-caddy
    profiles: ["edge"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      - APP_DOMAIN=${APP_DOMAIN}
      - ACME_EMAIL=${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./configs/Caddyfile.lite:/etc/caddy/Caddyfile:ro
      - aiops-lite-caddy-data:/data          # Let's Encrypt certs persist
      - aiops-lite-caddy-config:/config
    depends_on:
      - backend
      - frontend
    networks:
      - aiops-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

networks:
  aiops-network:
    driver: bridge

volumes:
  aiops-lite-state:
  aiops-lite-caddy-data:
  aiops-lite-caddy-config:
