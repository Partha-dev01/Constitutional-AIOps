# Constitutional AIOps - Hybrid Deployment Configuration
#
# Use this when running LLMs on Jarvis Labs (or any remote Ollama endpoint)
# and all other services locally.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker/docker-compose.hybrid.yml up -d
#
# Required environment variable:
#   JARVIS_OLLAMA_URL=https://your-instance.jarvislabs.net
#
# The backend will connect to the remote Ollama API via HTTPS.
# No SSH tunnel needed!

services:
  # Disable local LLM service - using remote Jarvis Labs Ollama
  llama-swap:
    profiles:
      - disabled

  # Backend connects to remote Ollama endpoint
  backend:
    environment:
      # Point both agents to the same Ollama endpoint
      # Different models are selected via the model parameter in API calls
      - FAST_AGENT_URL=${JARVIS_OLLAMA_URL:-http://localhost:11434}/v1
      - REASONING_AGENT_URL=${JARVIS_OLLAMA_URL:-http://localhost:11434}/v1
      # Model names for Ollama
      - FAST_AGENT_MODEL=qwen2.5:3b
      - REASONING_AGENT_MODEL=qwen2.5:14b
      # Increase timeouts for remote API calls
      - FAST_AGENT_TIMEOUT=60
      - REASONING_AGENT_TIMEOUT=180
      # Enable debug mode for development
      - DEBUG=true
    # For Windows Docker Desktop, use host.docker.internal if needed
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # All other services run locally with default configuration
  # - frontend: http://localhost:3000
  # - neo4j: http://localhost:7474 (browser), bolt://localhost:7687
  # - grafana: http://localhost:3001
  # - prometheus: http://localhost:9090
  # - loki: http://localhost:3100
