# Constitutional AIOps - Docker Compose Production Configuration
# Use with: docker-compose -f docker-compose.yml -f docker/docker-compose.production.yml up -d
#
# Production deployment on AWS g6.xlarge with NVIDIA L4 24GB GPU
# Includes security hardening, resource limits, and monitoring

services:
  # ==========================================================================
  # LLM Inference (Production - Both models always loaded)
  # ==========================================================================

  # Stack B: vLLM AWQ-marlin dual-model serving (replaces the Ollama-era llama-swap).
  # Mirrors aws/docker-compose.vllm.yml but joined to aiops-network so the backend
  # reaches them by service name. Models are pre-downloaded to /mnt/models on the VM.
  # Every chat request carries chat_template_kwargs.enable_thinking=false (ModelRouter
  # adds it automatically for colon-free served-model-names "qwen3-4b" / "qwen3-14b").
  qwen3-4b:
    image: vllm/vllm-openai:v0.9.2
    container_name: aiops-qwen3-4b
    runtime: nvidia
    ipc: host  # required by vLLM for shared memory
    ports:
      - "127.0.0.1:8000:8000"  # internal only; backend reaches via service name
    volumes:
      - /mnt/models:/models
      - /mnt/hf-cache:/root/.cache/huggingface
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - VLLM_LOGGING_LEVEL=INFO
      - HF_HOME=/root/.cache/huggingface
      - VLLM_ENABLE_V1_MULTIPROCESSING=0
    command: >
      --model Qwen/Qwen3-4B-AWQ
      --port 8000
      --host 0.0.0.0
      --gpu-memory-utilization 0.30
      --max-model-len 4096
      --quantization awq_marlin
      --max-num-seqs 4
      --seed 42
      --reasoning-parser qwen3
      --served-model-name qwen3-4b
      --enforce-eager
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - aiops-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  qwen3-14b:
    image: vllm/vllm-openai:v0.9.2
    container_name: aiops-qwen3-14b
    runtime: nvidia
    ipc: host
    ports:
      - "127.0.0.1:8001:8001"  # internal only
    volumes:
      - /mnt/models:/models
      - /mnt/hf-cache:/root/.cache/huggingface
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - VLLM_LOGGING_LEVEL=INFO
      - HF_HOME=/root/.cache/huggingface
      - VLLM_ENABLE_V1_MULTIPROCESSING=0
    command: >
      --model Qwen/Qwen3-14B-AWQ
      --port 8001
      --host 0.0.0.0
      --gpu-memory-utilization 0.55
      --max-model-len 8192
      --quantization awq_marlin
      --seed 42
      --reasoning-parser qwen3
      --served-model-name qwen3-14b
      --enforce-eager
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - aiops-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s  # 14B takes longer to warm up
    depends_on:
      qwen3-4b:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # ==========================================================================
  # Backend API (Production)
  # ==========================================================================

  backend:
    build:
      context: .   # repo root (project dir); matches the base file's context
      dockerfile: docker/Dockerfile.backend
      args:
        - BUILD_ENV=production
    container_name: aiops-backend
    # No host port: Caddy reaches the backend at http://backend:8000 on the
    # aiops-network. !override clears the base file's 0.0.0.0:8000 publish so the
    # API is never exposed directly and never collides with vLLM on host :8000.
    ports: !override []
    environment:
      - FAST_AGENT_URL=http://qwen3-4b:8000/v1
      - REASONING_AGENT_URL=http://qwen3-14b:8001/v1
      - FAST_AGENT_MODEL=qwen3-4b
      - REASONING_AGENT_MODEL=qwen3-14b
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - LOKI_URL=http://loki:3100
      - PROMETHEUS_URL=http://prometheus:9090
      - WS_TOKEN=${WS_TOKEN:-}
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=INFO
      - API_WORKERS=4
    depends_on:
      qwen3-4b:
        condition: service_healthy
      qwen3-14b:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
    networks:
      - aiops-network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

  # ==========================================================================
  # Frontend (Production)
  # ==========================================================================

  frontend:
    build:
      context: .   # repo root (project dir); matches the base file's context
      dockerfile: docker/Dockerfile.frontend
      args:
        - BUILD_ENV=production
        # Same-origin: default to relative /api/v1 so the bundle is domain-portable.
        # Set PUBLIC_API_URL=https://<domain>/api/v1 to hard-code an absolute origin.
        - VITE_API_URL=${PUBLIC_API_URL:-/api/v1}
    container_name: aiops-frontend
    # No host port: Caddy serves the SPA from http://frontend:3000 at "/".
    ports: !override []
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    networks:
      - aiops-network
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ==========================================================================
  # Neo4j Graph Database (Production)
  # ==========================================================================

  neo4j:
    image: neo4j:5.15-community
    container_name: aiops-neo4j
    ports: !override                # !override drops base's 0.0.0.0 publish
      - "127.0.0.1:7474:7474"  # Browser (loopback only; SSH-tunnel to debug)
      - "127.0.0.1:7687:7687"  # Bolt (loopback only)
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_initial__size=1G
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=512m
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      # EBS-backed bind-mounts (data volume vol-0123456789abcdef0 -> /mnt/data).
      # Survive instance stop/start so incident history + graph memory persist.
      - /mnt/data/neo4j/data:/data
      - /mnt/data/neo4j/logs:/logs
      - ./docker/configs/neo4j-backup.sh:/scripts/backup.sh:ro
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: '1'
    networks:
      - aiops-network
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ==========================================================================
  # Observability Stack (Production)
  # ==========================================================================

  loki:
    image: grafana/loki:2.9.3
    container_name: aiops-loki
    ports: !override
      - "127.0.0.1:3100:3100"  # loopback only
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - /mnt/data/loki:/loki  # EBS-backed; 30-day log retention
      - ./docker/configs/loki-config.yaml:/etc/loki/local-config.yaml:ro
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
    networks:
      - aiops-network
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # Ships Docker container JSON logs to Loki (job="containerlogs"). Uses the
  # static_configs promtail config (scrapes /var/lib/docker/containers/*/*log via
  # a positions file), so it needs the containers dir mounted read-only — NOT the
  # docker socket (no docker_sd in promtail-config.yaml). Without this, Loki is
  # empty and the Telemetry "Logs" panel shows "No logs available".
  promtail:
    image: grafana/promtail:2.9.3
    container_name: aiops-promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./docker/configs/promtail-config.yaml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    networks:
      - aiops-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: aiops-prometheus
    ports: !override
      - "127.0.0.1:9090:9090"  # loopback only
    volumes:
      - ./docker/configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /mnt/data/prometheus:/prometheus  # EBS-backed; 30-day metric retention
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-remote-write-receiver'  # accept edge Alloy remote_write (Gate 7)
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
    networks:
      - aiops-network
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  tempo:
    image: grafana/tempo:2.3.1
    container_name: aiops-tempo
    ports: !override
      - "127.0.0.1:3200:3200"  # loopback only
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    command: -config.file=/etc/tempo/tempo.yaml
    volumes:
      - ./docker/configs/tempo-config.yaml:/etc/tempo/tempo.yaml:ro
      - /mnt/data/tempo:/tmp/tempo  # EBS-backed; trace blocks + WAL
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'
    networks:
      - aiops-network
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  grafana:
    image: grafana/grafana:10.2.3
    container_name: aiops-grafana
    # No host port: Caddy serves Grafana under https://<domain>/grafana/.
    ports: !override []
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      # Sub-path serving so every Grafana asset/redirect URL is /grafana-prefixed.
      - GF_SERVER_ROOT_URL=https://${APP_DOMAIN}/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - /mnt/data/grafana:/var/lib/grafana  # EBS-backed; dashboards + Grafana state
      - ./docker/configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/configs/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - loki
      - prometheus
      - tempo
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    networks:
      - aiops-network
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ==========================================================================
  # OpenTelemetry Collector (Production)
  # ==========================================================================

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.91.0
    container_name: aiops-otel-collector
    ports: !override
      - "127.0.0.1:4319:4317"  # loopback only
      - "127.0.0.1:4320:4318"
      - "127.0.0.1:8888:8888"
    volumes:
      - ./docker/configs/otel-collector.yaml:/etc/otel/config.yaml:ro
    command: --config=/etc/otel/config.yaml
    depends_on:
      - loki
      - prometheus
      - tempo
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    networks:
      - aiops-network
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ==========================================================================
  # Reverse Proxy (Production - HTTPS edge)
  # ==========================================================================

  # Caddy is the ONLY public-facing service (80/443). It terminates TLS with
  # Let's Encrypt and path-routes to frontend / backend / grafana / ingest on the
  # internal aiops-network. Config: docker/configs/Caddyfile. Brought up by
  # aiops-caddy.service. The /ingest/* route + INGEST_BASIC_AUTH_* are added in
  # Gate 7. NOTE: bcrypt hashes contain '$' — escape each as '$$' in .env.production.
  caddy:
    image: caddy:2.8-alpine
    container_name: aiops-caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      - APP_DOMAIN=${APP_DOMAIN}
      - ACME_EMAIL=${ACME_EMAIL:-admin@example.com}
      - APP_BASIC_AUTH_USER=${APP_BASIC_AUTH_USER}
      - APP_BASIC_AUTH_HASH=${APP_BASIC_AUTH_HASH}
      # Separate machine credential for the remote edge agent (Gate 7 /ingest/*).
      - INGEST_BASIC_AUTH_USER=${INGEST_BASIC_AUTH_USER}
      - INGEST_BASIC_AUTH_HASH=${INGEST_BASIC_AUTH_HASH}
    volumes:
      - ./docker/configs/Caddyfile:/etc/caddy/Caddyfile:ro
      - /mnt/data/caddy/data:/data      # EBS-backed: Let's Encrypt certs persist
      - /mnt/data/caddy/config:/config
    depends_on:
      - frontend
      - backend
      - grafana
    networks:
      - aiops-network
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

networks:
  aiops-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# No top-level named volumes in production: every stateful service binds to the
# EBS data volume under /mnt/data so all data survives instance stop/start.
# Run aws/init-data-dirs.sh once (it is also an ExecStartPre of aiops-app.service)
# to create + chown those directories. See aws/EBS_PERSISTENCE.md.
