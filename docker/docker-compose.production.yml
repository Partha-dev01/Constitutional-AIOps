# Constitutional AIOps - Docker Compose Production Configuration
# Use with: docker-compose -f docker-compose.yml -f docker/docker-compose.production.yml up -d
#
# Production deployment on AWS g6.xlarge with NVIDIA L4 24GB GPU
# Includes security hardening, resource limits, and monitoring

version: "3.9"

services:
  # ==========================================================================
  # LLM Inference (Production - Both models always loaded)
  # ==========================================================================

  llama-swap:
    image: ghcr.io/mostlygeek/llama-swap:latest
    container_name: aiops-llama-swap
    ports:
      - "127.0.0.1:8080:8080"  # llama-swap proxy (internal only)
      - "127.0.0.1:8081:8081"  # Fast Agent (internal only)
      - "127.0.0.1:8082:8082"  # Reasoning Agent (internal only)
    volumes:
      - ./docker/configs/llama-swap.yaml:/config.yaml:ro
      - ./models:/models:ro
    command: --config /config.yaml
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 20G
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0
    networks:
      - aiops-network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s  # Models need time to load
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # ==========================================================================
  # Backend API (Production)
  # ==========================================================================

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
      args:
        - BUILD_ENV=production
    container_name: aiops-backend
    ports:
      - "127.0.0.1:8000:8000"  # Internal only, exposed via reverse proxy
    environment:
      - FAST_AGENT_URL=http://llama-swap:8081/v1
      - REASONING_AGENT_URL=http://llama-swap:8082/v1
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - LOKI_URL=http://loki:3100
      - PROMETHEUS_URL=http://prometheus:9090
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=INFO
      - API_WORKERS=4
    depends_on:
      llama-swap:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
    networks:
      - aiops-network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

  # ==========================================================================
  # Frontend (Production)
  # ==========================================================================

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        - BUILD_ENV=production
        - VITE_API_URL=${PUBLIC_API_URL:-http://localhost:8000}
    container_name: aiops-frontend
    ports:
      - "3000:3000"  # Exposed to public
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    networks:
      - aiops-network
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ==========================================================================
  # Neo4j Graph Database (Production)
  # ==========================================================================

  neo4j:
    image: neo4j:5.15-community
    container_name: aiops-neo4j
    ports:
      - "127.0.0.1:7474:7474"  # Browser (internal only)
      - "127.0.0.1:7687:7687"  # Bolt (internal only)
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_initial__size=1G
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=512m
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - ./docker/configs/neo4j-backup.sh:/scripts/backup.sh:ro
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: '1'
    networks:
      - aiops-network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ==========================================================================
  # Observability Stack (Production)
  # ==========================================================================

  loki:
    image: grafana/loki:2.9.3
    container_name: aiops-loki
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
      - ./docker/configs/loki-config.yaml:/etc/loki/local-config.yaml:ro
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
    networks:
      - aiops-network
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: aiops-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./docker/configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/configs/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
    networks:
      - aiops-network
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  tempo:
    image: grafana/tempo:2.3.1
    container_name: aiops-tempo
    ports:
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    command: -config.file=/etc/tempo/tempo.yaml
    volumes:
      - ./docker/configs/tempo-config.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/tmp/tempo
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'
    networks:
      - aiops-network
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  grafana:
    image: grafana/grafana:10.2.3
    container_name: aiops-grafana
    ports:
      - "3001:3000"  # Exposed to public
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3001}
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/configs/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - loki
      - prometheus
      - tempo
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    networks:
      - aiops-network
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ==========================================================================
  # OpenTelemetry Collector (Production)
  # ==========================================================================

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.91.0
    container_name: aiops-otel-collector
    ports:
      - "127.0.0.1:4319:4317"
      - "127.0.0.1:4320:4318"
      - "127.0.0.1:8888:8888"
    volumes:
      - ./docker/configs/otel-collector.yaml:/etc/otel/config.yaml:ro
    command: --config=/etc/otel/config.yaml
    depends_on:
      - loki
      - prometheus
      - tempo
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    networks:
      - aiops-network
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ==========================================================================
  # Reverse Proxy (Production - Optional, for HTTPS)
  # ==========================================================================

  # Uncomment to use Caddy as reverse proxy with automatic HTTPS
  # caddy:
  #   image: caddy:2-alpine
  #   container_name: aiops-caddy
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./docker/configs/Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy-data:/data
  #     - caddy-config:/config
  #   networks:
  #     - aiops-network
  #   restart: always

networks:
  aiops-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  neo4j-data:
    driver: local
  neo4j-logs:
    driver: local
  loki-data:
    driver: local
  prometheus-data:
    driver: local
  tempo-data:
    driver: local
  grafana-data:
    driver: local
  # caddy-data:
  #   driver: local
  # caddy-config:
  #   driver: local
