version: 2
updates:
  # Python / pip — covers pyproject.toml [project] dependencies +
  # [project.optional-dependencies] and the root requirements*.txt.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    # Batch the routine minor/patch churn into ONE PR; keep majors as
    # individual PRs so breaking upgrades still get their own review.
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # requirements*.txt is installed ONLY by the box Docker image build, not by
      # CI (ci-backend installs pyproject via `pip install -e .[dev]`), so bumps to
      # these packages cannot be validated by any automated gate here. They are
      # updated deliberately during a box image rebuild + runtime test, not via
      # auto-PRs, so they are ignored entirely. Routine CI-relevant pip deps
      # (fastapi, pydantic, httpx, neo4j, etc.) still flow via the grouped
      # minor/patch PR above.
      - dependency-name: "torch"
      - dependency-name: "sentence-transformers"
      - dependency-name: "datasets"
      - dependency-name: "huggingface-hub"
      - dependency-name: "websockets"
      - dependency-name: "opentelemetry-instrumentation-fastapi"
      - dependency-name: "scipy"
      - dependency-name: "orjson"
      - dependency-name: "pandas"
      - dependency-name: "transformers"
      # `asyncio` on PyPI is a pre-3.4 stdlib backport that must NOT be installed
      # on modern Python; the requirements pin is stale, so never auto-bump it.
      - dependency-name: "asyncio"
      # Dev-only tools (requirements-dev.txt; not shipped, not CI-installed).
      - dependency-name: "ipython"
      - dependency-name: "rich"
      - dependency-name: "watchfiles"
      - dependency-name: "pytest-mock"
      - dependency-name: "flake8"
      - dependency-name: "types-python-dateutil"

  # Node / npm — covers frontend/package.json (React, Playwright, Vitest, etc.)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # TypeScript 6.1+/7 breaks typescript-eslint 8 (its peer caps typescript
      # <6.1); revisit when typescript-eslint ships TS7 support.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # React 19 is a runtime migration handled as its own task.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]

  # GitHub Actions — covers .github/workflows/*.yml action pins (@v4 etc.).
  # Action bumps are low-risk and easy to review together, so batch them all.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions-all:
        patterns:
          - "*"

  # Node / npm — marketing site (Vite + Tailwind static marketing build).
  # Added 2026-09-20: this tree was previously unwatched, which is why it sat on
  # vite 5.4.21 while /frontend moved to a clean vite 8. Majors are deliberately
  # NOT ignored here: the vite and vitest majors ARE the advisory fix, since the
  # 5.x and 1.x lines have none.
  - package-ecosystem: "npm"
    directory: "/marketing"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"
    groups:
      marketing-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Node / npm — VitePress documentation site.
  # Added 2026-09-20. Note vitepress hard-depends on vite 5, so a vite major PR
  # here will not resolve until vitepress itself moves; close those rather than
  # forcing them.
  - package-ecosystem: "npm"
    directory: "/docs-site"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    groups:
      docs-site-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Node / npm — the published TypeScript SDK.
  # Added 2026-09-20. This tree carried an in-range js-yaml advisory fix that
  # nothing was watching for, which is the reason it went untaken.
  - package-ecosystem: "npm"
    directory: "/sdk/typescript"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    groups:
      sdk-typescript-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
