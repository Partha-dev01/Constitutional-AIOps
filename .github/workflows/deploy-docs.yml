name: deploy-docs

# Builds the VitePress docs site and publishes it to GitHub Pages.
# Pages must be enabled with "Source: GitHub Actions" (repo Settings, Pages),
# which requires the repository to be public (or a plan that allows private
# Pages). Until then configure-pages fails on every run, so the push trigger is
# disabled and this workflow is manual-only (same gating pattern as deploy.yml).
# Re-enable the push trigger below once Pages is enabled at the public flip.

on:
  # push:
  #   branches: [main]
  #   paths:
  #     - 'docs-site/**'
  #     - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

# Least-privilege by default; the deploy job elevates to exactly what Pages needs.
permissions:
  contents: read

# Never cancel an in-flight Pages deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Install
        run: npm install
      - name: Build
        run: npm run docs:build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs-site/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
