name: ci-frontend

on:
  push:
    branches: [main, thread-b-deploy]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'

# Least-privilege GITHUB_TOKEN: any scope named here forces all others to none.
permissions:
  contents: read

# Cancel superseded runs on the same branch / PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # Informational while the eslint backlog is ratcheted down.
      - name: Lint (informational)
        continue-on-error: true
        run: npm run lint

      # Blocking: unit tests + typecheck-and-build (vite build runs tsc).
      - name: Unit tests (vitest)
        run: npm run test

      - name: Typecheck + build
        run: npm run build
