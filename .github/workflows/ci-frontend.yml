name: ci-frontend

on:
  push:
    branches: [main, thread-b-deploy]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'

defaults:
  run:
    working-directory: frontend

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # Informational while the eslint backlog is ratcheted down.
      - name: Lint (informational)
        continue-on-error: true
        run: npm run lint

      # Blocking: unit tests + typecheck-and-build (vite build runs tsc).
      - name: Unit tests (vitest)
        run: npm run test

      - name: Typecheck + build
        run: npm run build
