name: ci-frontend

on:
  push:
    branches: [main, thread-b-deploy]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'

# Least-privilege GITHUB_TOKEN: any scope named here forces all others to none.
permissions:
  contents: read

# Cancel superseded runs on the same branch / PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # Informational while the eslint backlog is ratcheted down.
      - name: Lint (informational)
        continue-on-error: true
        run: npm run lint

      # Blocking: unit tests + typecheck-and-build (vite build runs tsc).
      - name: Unit tests (vitest)
        run: npm run test

      - name: Typecheck + build
        run: npm run build

  # Route-mocked Playwright suites (no backend, no network) — each config spins
  # its own `vite preview` of the prod build on its own port. These guard the
  # cockpit, the platform schema graph, the graph explorer and the setup wizard
  # against silent UI drift; they rotted once precisely because nothing ran them
  # in CI. local-ui.spec.ts is intentionally excluded (it owns no webServer and
  # is a manual pre-deploy screenshot harness, not a regression gate).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      # The preview configs serve the production bundle, so build once first.
      - name: Build
        run: npm run build

      - name: E2E - Command Center layout
        run: npx playwright test --config playwright.config.console.ts --retries=1

      - name: E2E - platform schema graph
        run: npx playwright test --config playwright.config.schema.ts --retries=1

      - name: E2E - graph explorer + topology update
        run: npx playwright test --config playwright.config.graph-update.ts --retries=1

      - name: E2E - setup wizard
        run: npx playwright test --config playwright.config.setup.ts --retries=1
