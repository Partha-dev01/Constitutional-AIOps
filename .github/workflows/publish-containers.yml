name: publish-containers

# Publishes the backend and frontend images to GitHub's container registry.
# Two reasons: self-hosters get a built image instead of a 10-minute local
# build, and the images show up on the repository page, which npm and PyPI
# packages cannot do (GitHub Packages has no PyPI registry, and its npm
# registry only accepts packages scoped to the account name).
#
# Release-triggered rather than push-triggered on purpose: the backend image
# installs torch, so a build is slow and the layers are large. Use the manual
# dispatch for a one-off build from the current ref.
on:
  release:
    types: [published]
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN: naming any scope forces all others to none.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            dockerfile: docker/Dockerfile.backend
            # The default ARG is empty, which resolves CUDA wheels. A published
            # image has no GPU, so pull the CPU index instead. This is a build
            # arg, so Dockerfile.backend itself stays byte-identical.
            build_args: TORCH_INDEX_URL=https://download.pytorch.org/whl/cpu
          - component: frontend
            dockerfile: docker/Dockerfile.frontend
            build_args: VITE_SHOW_SELFHOST=true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GHCR rejects uppercase image paths and the owner here is mixed case.
      # Both values reach the script through env rather than ${{ }} interpolation,
      # so nothing is ever spliced into the shell text itself. Neither is
      # attacker-controlled, but keeping run blocks free of interpolation means
      # the rule never has to be re-argued per workflow.
      - name: Resolve the image path
        id: img
        env:
          REPO: ${{ github.repository }}
          COMPONENT: ${{ matrix.component }}
        run: |
          echo "name=ghcr.io/$(echo "$REPO" | tr '[:upper:]' '[:lower:]')-$COMPONENT" >> "$GITHUB_OUTPUT"

      # Also emits org.opencontainers.image.source, which is what links the
      # published package back to this repository in the sidebar.
      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=sha,format=short,enable=${{ github.event_name == 'workflow_dispatch' }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Keeps the package page from listing an unknown/unknown attestation
          # entry beside the real image.
          provenance: false
