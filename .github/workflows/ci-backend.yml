name: ci-backend

# Mocked, no-GPU backend CI. The benchmark tree is intentionally excluded
# (separate effort) via the path filters below.
on:
  push:
    branches: [main, thread-b-deploy]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'

# Least-privilege GITHUB_TOKEN: any scope named here forces all others to none.
permissions:
  contents: read

# Cancel superseded runs on the same branch / PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install app + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Lint/type are informational while the backlog is ratcheted down
      # (see pyproject [tool.ruff.lint]); flip to blocking once clean.
      - name: Ruff lint (informational)
        continue-on-error: true
        run: ruff check src tests

      - name: Mypy (informational)
        continue-on-error: true
        run: mypy src

      # Blocking quality gate: tests + coverage floor (fail_under from pyproject).
      - name: Pytest + coverage
        env:
          ENVIRONMENT: local
          TESTING: 'true'
        run: pytest tests/ --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage.xml
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: ignore
