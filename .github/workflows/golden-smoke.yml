name: golden-smoke

# Schema-only golden regression check on every PR. Catches:
#   - cases.jsonl structure breakage (missing required fields, bad IDs)
#   - drift in case count (must stay exactly 10)
#   - drift in case-type distribution (3 ann + 3 RCA + 2 rem + 2 neg)
#
# The LIVE LLM tests (calling vLLM/Ollama against real endpoints) are NOT
# triggered here — they require GPU access and live model endpoints.
# Run those manually against the AWS VM with:
#     GOLDEN_SMOKE_LIVE=1 pytest tests/test_golden_regression.py -v

on:
  pull_request:
    paths:
      - 'src/agents/**'
      - 'src/benchmark/**'
      - 'tests/golden/**'
      - 'tests/test_golden_regression.py'
      - 'requirements.txt'
      - '.github/workflows/golden-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'src/agents/**'
      - 'src/benchmark/**'
      - 'tests/golden/**'
      - 'tests/test_golden_regression.py'

# Least-privilege GITHUB_TOKEN: any scope named here forces all others to none.
permissions:
  contents: read

# Cancel superseded runs on the same branch / PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install minimal deps (no heavy ML libs needed for schema)
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio

      - name: Run golden schema tests
        run: pytest tests/test_golden_regression.py -v -x
