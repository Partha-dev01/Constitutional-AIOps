<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="rc-title rc-desc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="rc-title">Reference configuration: 24 GB VRAM, both models loaded</title>
  <desc id="rc-desc">The research-paper reference runs both engines co-resident on one 24 GB GPU with vLLM: a fast agent (Qwen3-4B, port 8000) for telemetry annotation and a reasoning agent (Qwen3-14B, port 8001) for root cause, remediation, and chat.</desc>
  <rect x="6" y="6" width="708" height="288" rx="16" fill="#050c1c" stroke="#26364f" stroke-width="1.5"/>
  <text x="34" y="36" fill="#3b82f6" font-size="10.5" font-weight="600" letter-spacing="2">REFERENCE CONFIGURATION &#183; vLLM AWQ</text>
  <text x="34" y="60" fill="#f8fafc" font-size="16" font-weight="600">24 GB VRAM, both models co-resident</text>
  <line x1="34" y1="76" x2="686" y2="76" stroke="#1e293b" stroke-width="1.2"/>

  <!-- fast engine -->
  <rect x="34" y="92" width="316" height="150" rx="12" fill="#0b1628" stroke="#24324a" stroke-width="1.5"/>
  <text x="56" y="124" fill="#5aa2f6" font-size="10.5" font-weight="600" letter-spacing="2">FAST AGENT</text>
  <rect x="262" y="110" width="76" height="22" rx="11" fill="#0e1c33" stroke="#2a3b57"/>
  <text x="300" y="125" text-anchor="middle" fill="#94a3b8" font-size="10">port 8000</text>
  <text x="56" y="160" fill="#f8fafc" font-size="24" font-weight="700">Qwen3-4B</text>
  <text x="56" y="186" fill="#94a3b8" font-size="12.5">Telemetry annotation + classification</text>
  <rect x="56" y="204" width="94" height="24" rx="12" fill="#0c1b33" stroke="#1d4ed8"/>
  <text x="103" y="220" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="600">~4 GB VRAM</text>

  <!-- reasoning engine -->
  <rect x="370" y="92" width="316" height="150" rx="12" fill="#0b1628" stroke="#24324a" stroke-width="1.5"/>
  <text x="392" y="124" fill="#5aa2f6" font-size="10.5" font-weight="600" letter-spacing="2">REASONING AGENT</text>
  <rect x="598" y="110" width="76" height="22" rx="11" fill="#0e1c33" stroke="#2a3b57"/>
  <text x="636" y="125" text-anchor="middle" fill="#94a3b8" font-size="10">port 8001</text>
  <text x="392" y="160" fill="#f8fafc" font-size="24" font-weight="700">Qwen3-14B</text>
  <text x="392" y="186" fill="#94a3b8" font-size="12.5">Root cause &#183; remediation &#183; human chat</text>
  <rect x="392" y="204" width="104" height="24" rx="12" fill="#0c1b33" stroke="#1d4ed8"/>
  <text x="444" y="220" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="600">~15 GB VRAM</text>

  <text x="360" y="276" text-anchor="middle" fill="#64748b" font-size="11">Both engines always resident. No hot-swap, no swap latency.</text>
</svg>
